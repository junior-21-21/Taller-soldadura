    <stop offset=".85" stop-color="#17181b"/><stop offset="1" stop-color="#3a3d43"/>
  </linearGradient>
  <radialGradient id="rrArc">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".18" stop-color="#e8f4ff"/>
    <stop offset=".4" stop-color="#ffd166" stop-opacity=".8"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
  </radialGradient>
  <filter id="rrGlow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
    <feFlood flood-color="#ff6a00" flood-opacity=".85"/><feComposite in2="b" operator="in" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
